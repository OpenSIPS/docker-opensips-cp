name: Push OpenSIPS Control Panel Image to Docker Hub and GHCR

on:
  push:
  repository_dispatch:
    types: [OpenSIPS CP trigger]
  workflow_dispatch:
    inputs:
      branch:
        description: opensips-cp branch to build
        default: master
      docker_tag:
        description: Image tag to push
        default: latest

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Determine tag
      env:
        IN_BRANCH: ${{ inputs.branch || github.event.client_payload.branch }}
        IN_TAG: ${{ inputs.docker_tag || github.event.client_payload.docker_tag }}
      run: |
        echo "BRANCH=${IN_BRANCH:-master}" >> "$GITHUB_ENV"
        echo "DOCKER_TAG=${IN_TAG:-latest}" >> "$GITHUB_ENV"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        build-args: |
          OPENSIPS_CP_VERSION=${{ env.BRANCH }}
        push: true
        tags: |
          opensips/opensips-cp:${{ env.DOCKER_TAG }}
          ghcr.io/opensips/opensips-cp:${{ env.DOCKER_TAG }}
